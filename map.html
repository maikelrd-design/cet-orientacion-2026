<!doctype html><html><head><meta charset="utf8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
 html,body,#map{height:100%;margin:0}
 .lbl{font-family:Arial,Helvetica,sans-serif;font-weight:700;white-space:nowrap;
      padding:4px 9px;border-radius:14px;color:#fff;font-size:15px;
      box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff}
 .dot{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
 .wrap{display:flex;align-items:center;gap:6px;transform:transl(-8px,-8px)}
</style></head><body><div id="map"></div>
<script>
var map=L.map('map',{zoomControl:false,attributionControl:false});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
var pts=[
 {k:'MEDIA · Umbría de Fresnedas', lat:38.585, lon:-3.66157, c:'#58a618'},
 {k:'LARGA · Peñas Negrillas',     lat:38.42322, lon:-3.49377, c:'#1f76c4'},
 {k:'RELEVO · Villamayor de Calatrava', lat:38.789667, lon:-4.1395, c:'#e8a200'},
 {k:'ALOJAMIENTO · Acuartelamiento Sánchez Bilbao (Almagro)', lat:38.9533, lon:-3.7414, c:'#b4232a'},
];
var group=[];
pts.forEach(function(p){
 var html='<div style="display:flex;align-items:center;gap:7px">'+
   '<div class="dot" style="background:'+p.c+'"></div>'+
   '<div class="lbl" style="background:'+p.c+'">'+p.k+'</div></div>';
 var ic=L.divIcon({html:html,className:'',iconSize:[10,10],iconAnchor:[8,8]});
 L.marker([p.lat,p.lon],{icon:ic}).addTo(map);
 group.push([p.lat,p.lon]);
});
map.fitBounds(group,{padding:[90,90]});
window.__ready=false;
map.whenReady(function(){ setTimeout(function(){window.__ready=true;},1200); });
</script></body></html>
